<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập · Muse2API</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c1220;color:#edf2ff;font:16px system-ui;padding:24px}main{width:100%;max-width:400px;background:#151e30;padding:32px;border:1px solid #33415d;border-radius:16px}h1{margin-top:0}label{display:block;margin:18px 0 8px}input,button{font:inherit;width:100%;padding:12px;border-radius:8px;border:1px solid #60708e}input{background:#0c1220;color:inherit}button{margin-top:24px;background:#416bd9;color:white;cursor:pointer}button:disabled{opacity:.6}a{color:#9fbaff}#error{color:#ffb8b8;min-height:24px}p{color:#bcc8df}
</style>
</head>
<body><main>
<h1>Muse2API</h1><p>Đăng nhập để truy cập quản trị.</p>
<form id="login">
<label for="username">Tên đăng nhập</label>
<input id="username" name="username" autocomplete="username" maxlength="256" required autofocus>
<label for="password">Mật khẩu</label>
<input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
<button id="submit" type="submit">Đăng nhập</button>
<p id="error" role="alert" aria-live="polite"></p>
</form>
</main><script>
document.getElementById('login').addEventListener('submit', async event => {
  event.preventDefault();
  const button = document.getElementById('submit');
  const error = document.getElementById('error');
  button.disabled = true; error.textContent = '';
  try {
    const response = await fetch('/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: document.getElementById('username').value,
                            password: document.getElementById('password').value})
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || data.error?.message || 'Đăng nhập thất bại');
    location.replace('/admin');
  } catch (e) { error.textContent = e.message; }
  finally { button.disabled = false; }
});
</script></body></html>
